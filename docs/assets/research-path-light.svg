<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" role="img" aria-labelledby="title description">
<title id="title">From measured systems to controlled text research.</title><desc id="description">TinyWorld and Sudoku have measured results. Controlled text is planned, gated on data rights, held-out quality and a matched autoregressive baseline. General text quality is not established.</desc>
<rect width="1080" height="440" rx="16" fill="#ffffff"/>
<g font-family="Inter, Helvetica Neue, Arial, sans-serif" fill="#20252b">
<text x="32" y="49" font-size="32" font-weight="650" fill="#20252b" text-anchor="start">Evidence first. Text research next.</text>
<rect x="32" y="110" width="312" height="211" rx="4" fill="#f3f5f7"/>
<text x="52" y="142" font-size="16" font-weight="400" fill="#59636e" text-anchor="start">01  MEASURED</text>
<text x="52" y="187" font-size="27" font-weight="600" fill="#20252b" text-anchor="start">TinyWorld</text>
<text x="52" y="229" font-size="17" font-weight="400" fill="#59636e" text-anchor="start">Synthetic grammar</text>
<text x="52" y="260" font-size="17" font-weight="400" fill="#59636e" text-anchor="start">Codec + generator + AR</text>
<text x="52" y="291" font-size="17" font-weight="400" fill="#59636e" text-anchor="start">Quality and latency trade-off</text>
<path d="M349 211h30m-6 -5l6 5 -6 5" fill="none" stroke="#59636e" stroke-width="2"/>
<rect x="384" y="110" width="312" height="211" rx="4" fill="#f3f5f7"/>
<text x="404" y="142" font-size="16" font-weight="400" fill="#59636e" text-anchor="start">02  MEASURED</text>
<text x="404" y="187" font-size="27" font-weight="600" fill="#20252b" text-anchor="start">Sudoku</text>
<text x="404" y="229" font-size="17" font-weight="400" fill="#59636e" text-anchor="start">E19 and E20 completed</text>
<text x="404" y="260" font-size="17" font-weight="400" fill="#59636e" text-anchor="start">Easy / medium retained</text>
<text x="404" y="291" font-size="17" font-weight="400" fill="#59636e" text-anchor="start">Hard-board gap unresolved</text>
<path d="M701 211h30m-6 -5l6 5 -6 5" fill="none" stroke="#59636e" stroke-width="2"/>
<rect x="736" y="110" width="312" height="211" rx="4" fill="none" stroke="#d6dce2" stroke-dasharray="5 5"/>
<text x="756" y="142" font-size="16" font-weight="400" fill="#59636e" text-anchor="start">03  PLANNED</text>
<text x="756" y="187" font-size="27" font-weight="600" fill="#20252b" text-anchor="start">Controlled text</text>
<text x="756" y="229" font-size="17" font-weight="400" fill="#59636e" text-anchor="start">Pin data rights and splits</text>
<text x="756" y="260" font-size="17" font-weight="400" fill="#59636e" text-anchor="start">Measure held-out quality</text>
<text x="756" y="291" font-size="17" font-weight="400" fill="#59636e" text-anchor="start">Match an AR training budget</text>
<path d="M32 357H1048" stroke="#d6dce2"/>
<text x="32" y="398" font-size="21" font-weight="600" fill="#20252b" text-anchor="start">Next gates, not promised capabilities.</text>
<text x="1048" y="398" font-size="18" font-weight="400" fill="#59636e" text-anchor="end">Real-text quality is not established today.</text>
</g></svg>
