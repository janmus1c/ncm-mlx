<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1070" role="img" aria-labelledby="title description">
<title id="title">Propose. Verify. Commit.</title><desc id="description">A future greedy text verifier: propose target-token candidates from committed history, check their longest matching prefix with the autoregressive target, commit matches plus the target correction or bonus, and rewind rejected cache entries. No local speed result is established.</desc>
<rect width="420" height="1070" rx="16" fill="#13161a"/>
<g font-family="Inter, Helvetica Neue, Arial, sans-serif" fill="#f1f2f3">
<text x="28" y="49" font-size="24" font-weight="650" fill="#f1f2f3" text-anchor="start">Propose. Verify. Commit.</text>
<text x="28" y="89" font-size="18" font-weight="400" fill="#b4bac1" text-anchor="start">Proposed text experiment</text>
<text x="28" y="115" font-size="18" font-weight="400" fill="#b4bac1" text-anchor="start">greedy target verification</text>
<rect x="28" y="146" width="364" height="215" rx="4" fill="#1c2025"/>
<text x="48" y="178" font-size="16" font-weight="400" fill="#b4bac1" text-anchor="start">01  CHEAP PROPOSAL</text>
<text x="48" y="223" font-size="25" font-weight="600" fill="#f1f2f3" text-anchor="start">Draft the next block</text>
<text x="48" y="265" font-size="18" font-weight="400" fill="#b4bac1" text-anchor="start">Use committed history</text>
<text x="48" y="296" font-size="18" font-weight="400" fill="#b4bac1" text-anchor="start">Propose target token IDs</text>
<text x="48" y="327" font-size="18" font-weight="400" fill="#b4bac1" text-anchor="start">Count all drafting work</text>
<path d="M210 374v30m-5 -6l5 6 5 -6" fill="none" stroke="#b4bac1" stroke-width="2"/>
<rect x="28" y="411" width="364" height="215" rx="4" fill="#1c2025"/>
<text x="48" y="443" font-size="16" font-weight="400" fill="#b4bac1" text-anchor="start">02  TARGET CHECK</text>
<text x="48" y="488" font-size="25" font-weight="600" fill="#f1f2f3" text-anchor="start">Verify causally</text>
<text x="48" y="530" font-size="18" font-weight="400" fill="#b4bac1" text-anchor="start">Check the matching prefix</text>
<text x="48" y="561" font-size="18" font-weight="400" fill="#b4bac1" text-anchor="start">Stop at the first mismatch</text>
<text x="48" y="592" font-size="18" font-weight="400" fill="#b4bac1" text-anchor="start">Later states are provisional</text>
<path d="M210 639v30m-5 -6l5 6 5 -6" fill="none" stroke="#b4bac1" stroke-width="2"/>
<rect x="28" y="676" width="364" height="215" rx="4" fill="#1c2025"/>
<text x="48" y="708" font-size="16" font-weight="400" fill="#b4bac1" text-anchor="start">03  STATE UPDATE</text>
<text x="48" y="753" font-size="25" font-weight="600" fill="#f1f2f3" text-anchor="start">Commit and rewind</text>
<text x="48" y="795" font-size="18" font-weight="400" fill="#b4bac1" text-anchor="start">Keep matched tokens</text>
<text x="48" y="826" font-size="18" font-weight="400" fill="#b4bac1" text-anchor="start">Add target correction/bonus</text>
<text x="48" y="857" font-size="18" font-weight="400" fill="#b4bac1" text-anchor="start">Discard rejected cache state</text>
<path d="M28 933H392" stroke="#454c55"/>
<text x="28" y="970" font-size="17" font-weight="400" fill="#b4bac1" text-anchor="start">Honor EOS and the remaining output</text>
<text x="28" y="997" font-size="17" font-weight="400" fill="#b4bac1" text-anchor="start">budget.</text>
<text x="28" y="1024" font-size="17" font-weight="400" fill="#b4bac1" text-anchor="start">Greedy identity is a separate contract</text>
<text x="28" y="1051" font-size="17" font-weight="400" fill="#b4bac1" text-anchor="start">from stochastic sampling.</text>
</g></svg>
