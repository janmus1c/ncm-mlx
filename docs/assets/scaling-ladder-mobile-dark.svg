<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 980" role="img" aria-labelledby="title description">
<title id="title">With a larger generator and more data the NCM/AR ratio falls, and stays above two.</title><desc id="description">NCM over AR ratio of GPT-2-large generative perplexity on TinyStories by generator size. Ratios at 1x data and fp32: 3.33, 2.43, 2.38 for 12M, 50M and 87M generators. Ratios at 4x data and bf16: 3.05, 2.89, 2.21, 2.13 (12M seeds 0 and 1, then 50M and 87M). One training seed per point except the 12M point at 4x data; the 50M to 87M step is within seed variation. Compute is not matched.</desc>
<rect width="420" height="980" rx="16" fill="#13161a"/>
<g font-family="Inter, Helvetica Neue, Arial, sans-serif" fill="#f1f2f3">
<text x="28" y="48" font-size="26" font-weight="650" fill="#f1f2f3" text-anchor="start">NCM versus AR, by size</text>
<text x="28" y="80" font-size="17" font-weight="400" fill="#b4bac1" text-anchor="start">Ratio of GPT-2-large perplexities</text>
<text x="28" y="104" font-size="17" font-weight="400" fill="#b4bac1" text-anchor="start">TinyStories · lower is better</text>
<path d="M72 578.8H398" stroke="#454c55" stroke-dasharray="6 5"/>
<text x="62" y="584.7857142857143" font-size="15" font-weight="400" fill="#b4bac1" text-anchor="end">1 · parity</text>
<path d="M72 446.6H398" stroke="#454c55"/>
<text x="62" y="452.6428571428571" font-size="15" font-weight="400" fill="#b4bac1" text-anchor="end">2</text>
