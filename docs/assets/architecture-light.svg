<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 570" role="img" aria-labelledby="title description">
<title id="title">Two stages. One hierarchy.</title><desc id="description">Train a codec to encode, quantize and reconstruct text. Freeze the codec, then train a generator to predict the code hierarchy. During inference, generate codes and decode once.</desc>
<rect width="1080" height="570" rx="16" fill="#ffffff"/>
<g font-family="Inter, Helvetica Neue, Arial, sans-serif" fill="#20252b">
<text x="32" y="52" font-size="34" font-weight="650" fill="#20252b" text-anchor="start">Two stages. One hierarchy.</text>
<text x="32" y="101" font-size="20" font-weight="400" fill="#59636e" text-anchor="start">01  Learn a discrete code hierarchy</text>
<rect x="32" y="133" width="242" height="132" rx="4" fill="#f3f5f7"/>
<text x="52" y="180" font-size="25" font-weight="600" fill="#20252b" text-anchor="start">Text</text>
<text x="52" y="218" font-size="19" font-weight="400" fill="#59636e" text-anchor="start">gus finds two blue hens.</text>
<path d="M287 199h30m-6 -5l6 5 -6 5" fill="none" stroke="#59636e" stroke-width="2"/>
<text x="340" y="167" font-size="26" font-weight="600" fill="#20252b" text-anchor="start">Encoder → residual VQ</text>
<text x="340" y="204" font-size="20" font-weight="400" fill="#59636e" text-anchor="start">A hierarchy of discrete codes</text>
<rect x="340" y="224" width="10" height="10" rx="4" fill="#20252b"/>
<rect x="340" y="241" width="10" height="10" rx="4" fill="#20252b"/>
<rect x="354" y="241" width="10" height="10" rx="4" fill="#20252b"/>
<rect x="340" y="258" width="10" height="10" rx="4" fill="#20252b"/>
<rect x="354" y="258" width="10" height="10" rx="4" fill="#20252b"/>
<rect x="368" y="258" width="10" height="10" rx="4" fill="#20252b"/>
<rect x="382" y="258" width="10" height="10" rx="4" fill="#20252b"/>
<rect x="340" y="275" width="10" height="10" rx="4" fill="#20252b"/>
<rect x="354" y="275" width="10" height="10" rx="4" fill="#20252b"/>
<rect x="368" y="275" width="10" height="10" rx="4" fill="#20252b"/>
<rect x="382" y="275" width="10" height="10" rx="4" fill="#20252b"/>
<rect x="396" y="275" width="10" height="10" rx="4" fill="#20252b"/>
<rect x="410" y="275" width="10" height="10" rx="4" fill="#20252b"/>
<rect x="424" y="275" width="10" height="10" rx="4" fill="#20252b"/>
<rect x="438" y="275" width="10" height="10" rx="4" fill="#20252b"/>
<text x="510" y="249" font-size="19" font-weight="400" fill="#59636e" text-anchor="start">coarse → fine</text>
<path d="M727 199h30m-6 -5l6 5 -6 5" fill="none" stroke="#59636e" stroke-width="2"/>
<rect x="780" y="133" width="268" height="132" rx="4" fill="#f3f5f7"/>
<text x="802" y="180" font-size="25" font-weight="600" fill="#20252b" text-anchor="start">Decoder</text>
<text x="802" y="218" font-size="20" font-weight="400" fill="#59636e" text-anchor="start">Rebuild the input text</text>
<path d="M32 320H1048" stroke="#d6dce2"/>
<text x="32" y="365" font-size="20" font-weight="400" fill="#59636e" text-anchor="start">02  Freeze the codec. Learn to generate its hierarchy.</text>
<rect x="32" y="396" width="332" height="118" rx="4" fill="#f3f5f7"/>
<text x="52" y="437" font-size="24" font-weight="600" fill="#20252b" text-anchor="start">Next-concept transformer</text>
<text x="52" y="474" font-size="19" font-weight="400" fill="#59636e" text-anchor="start">Every position of a level at once</text>
<path d="M379 455h30m-6 -5l6 5 -6 5" fill="none" stroke="#59636e" stroke-width="2"/>
<text x="432" y="437" font-size="25" font-weight="600" fill="#20252b" text-anchor="start">Coarse → fine codes</text>
<text x="432" y="474" font-size="19" font-weight="400" fill="#59636e" text-anchor="start">Earlier levels condition the next</text>
<path d="M727 455h30m-6 -5l6 5 -6 5" fill="none" stroke="#59636e" stroke-width="2"/>
<rect x="780" y="396" width="268" height="118" rx="4" fill="#f3f5f7"/>
<text x="802" y="437" font-size="25" font-weight="600" fill="#20252b" text-anchor="start">Decode once</text>
<text x="802" y="474" font-size="20" font-weight="400" fill="#59636e" text-anchor="start">Generated text</text>
<text x="32" y="551" font-size="17" font-weight="400" fill="#59636e" text-anchor="start">Shared architecture; TinyWorld and Sudoku use different codec settings.</text>
</g></svg>
