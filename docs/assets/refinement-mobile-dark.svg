<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 920" role="img" aria-labelledby="title description"><title id="title">One real sample, refined level by level</title><desc id="description">A recorded TinyWorld generation. Level 0 predicts one code and gives a rough guess, eue likes one oed egg. Levels 1 to 3 settle the words, reaching dee likes one red egg. A fine level then breaks red into ret, and the final level 5 output, dee likes one ret egg., is invalid for spelling.</desc>
