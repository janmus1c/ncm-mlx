name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: lint and platform-independent tests (Linux, no MLX)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python scripts/validate_repository.py
      - run: uv build --out-dir dist
      - name: Install and check the wheel outside the source tree
        run: |
          uv venv /tmp/ncm-wheel --python ${{ matrix.python-version }}
          uv pip install --python /tmp/ncm-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/ncm-wheel/bin/python -c "from importlib.metadata import version; from ncm_mlx.config import Config; from ncm_mlx.text.toygrammar import all_sentences; print(version('ncm-mlx')); Config().validate(); assert len(all_sentences()) == 15360"
