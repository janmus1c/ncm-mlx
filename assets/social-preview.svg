<text x="84" y="420" font-size="16" fill="#59636e">LEVEL 1</text>
<rect x="174" y="410" width="8" height="8" rx="2" fill="#20252b"/><rect x="186" y="410" width="8" height="8" rx="2" fill="#20252b"/>
<text x="386" y="424" font-size="34"><tspan fill="#20252b" font-weight="650">eve</tspan> <tspan fill="#59636e" font-weight="400">likes</tspan> <tspan fill="#59636e" font-weight="400">one</tspan> <tspan fill="#20252b" font-weight="650">oig</tspan> <tspan fill="#59636e" font-weight="400">egg.</tspan></text>
<text x="84" y="482" font-size="16" fill="#59636e">LEVEL 2</text>
<rect x="174" y="472" width="8" height="8" rx="2" fill="#20252b"/><rect x="186" y="472" width="8" height="8" rx="2" fill="#20252b"/><rect x="198" y="472" width="8" height="8" rx="2" fill="#20252b"/><rect x="210" y="472" width="8" height="8" rx="2" fill="#20252b"/>
<text x="386" y="486" font-size="34"><tspan fill="#20252b" font-weight="650">dee</tspan> <tspan fill="#59636e" font-weight="400">likes</tspan> <tspan fill="#59636e" font-weight="400">one</tspan> <tspan fill="#20252b" font-weight="650">red</tspan> <tspan fill="#59636e" font-weight="400">egg.</tspan></text>
