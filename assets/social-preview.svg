<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title description">
<title id="title">NCM-MLX</title>
<desc id="description">Next-Concept Modeling in MLX: parallel within a level, coarse to fine across levels. A real TinyWorld sample resolves from a rough guess to a sentence over successive levels.</desc>
<rect width="1280" height="640" fill="#ffffff"/>
<g font-family="Inter, Helvetica Neue, Arial, sans-serif" fill="#20252b">
<g transform="translate(48 48) scale(2)"><path fill="#20252b" d="M4 4h24v4H4zm0 10h10v4H4zm14 0h10v4H18zM4 24h4v4H4zm6.667 0h4v4h-4zm6.666 0h4v4h-4zM24 24h4v4h-4z"/></g>
<text x="140" y="96" font-size="56" font-weight="700">NCM-MLX</text>
<text x="56" y="170" font-size="32" fill="#59636e">Next-Concept Modeling in MLX — parallel within a level,</text>
<text x="56" y="212" font-size="32" fill="#59636e">coarse to fine across levels</text>
<rect x="56" y="258" width="1168" height="326" rx="4" fill="#f3f5f7"/>
<text x="84" y="296" font-size="16" fill="#59636e">REAL SAMPLE · TinyWorld · one forward pass per level</text>
<text x="1196" y="296" font-size="16" fill="#59636e" text-anchor="end">github.com/janmus1c/ncm-mlx</text>
